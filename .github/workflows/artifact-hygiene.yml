name: Artifact hygiene

# Fails a pull request that leaks a personal path, a denylisted project name, or narration of the session that
# produced the change. The rule already lives in CONTRIBUTING and the PR template; this makes it mechanical.
#
# `edited` is in the trigger list on purpose: the PR body is a published artifact, and editing it after opening
# would otherwise slip past a check that only ran on push.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    name: No leaked references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # commit messages and the branch diff both need real history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect the PR's text surfaces
        # Every value from the pull request arrives through `env`, never interpolated into the script body.
        # A title containing shell syntax is then data, not code.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p .hygiene
          printf '%s' "$PR_TITLE" > .hygiene/title.txt
          printf '%s' "$PR_BODY"  > .hygiene/body.txt
          # Compare against the merge base, so a base branch that moved on does not drag unrelated commits in.
          BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git log --format='%H%n%B' "$BASE".."$HEAD_SHA" > .hygiene/commits.txt
          git diff "$BASE" "$HEAD_SHA"                   > .hygiene/diff.txt

      - name: Check
        env:
          ARTIFACT_DENYLIST: ${{ secrets.ARTIFACT_DENYLIST }}
        run: python .github/scripts/check_artifact_hygiene.py .hygiene
