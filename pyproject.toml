[project]
name = "spec-eval"
dynamic = ["version"]                     # single source of truth: spec_eval/__init__.py (__version__)
description = "A trust-eval for your specs: coverage, drift, and sufficiency of markdown specs against code."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ben Jones" }]
keywords = ["spec-driven-development", "documentation-drift", "docs-as-code", "living-documentation",
            "llm-as-judge", "code-documentation", "backfill-documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6", "ruff>=0.4"]

[project.scripts]
spec-eval = "spec_eval.cli:main"

[project.urls]
Homepage = "https://github.com/benjaminjones/spec-eval"
Repository = "https://github.com/benjaminjones/spec-eval"
Issues = "https://github.com/benjaminjones/spec-eval/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spec_eval"]

[tool.setuptools.dynamic]
version = { attr = "spec_eval.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]                       # Layer 0 — static analysis
line-length = 120

[tool.ruff.lint]
# Pinned rather than inherited. ruff's DEFAULT rule set is not stable across releases: 0.15 selected
# E4/E7/E9 + F, and 0.16 widened it, so the same source went from 0 findings to 96 on a patch-level upgrade of
# the linter alone. Naming the set makes Layer 0 mean the same thing on every machine and every CI run.
# Widening it is a deliberate change with its own diff, not something a dependency resolution does silently.
select = ["E4", "E7", "E9", "F"]
